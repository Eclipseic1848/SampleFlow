services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sampleflow
      POSTGRES_USER: sampleflow
      POSTGRES_PASSWORD: sampleflow_dev
    ports:
      - "55432:5432"
    volumes:
      - sampleflow_dev_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampleflow -d sampleflow"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  sampleflow_dev_db:
