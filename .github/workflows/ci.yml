name: SampleFlow quality gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: p0-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build and audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sampleflow
          POSTGRES_USER: sampleflow
          POSTGRES_PASSWORD: sampleflow_dev
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sampleflow -d sampleflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium 及系统依赖
        run: npx playwright install --with-deps chromium

      - name: 执行类型、测试、契约与构建门禁
        run: npm run typecheck && npm run test && npm run test:container-contract && npm run build
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://sampleflow:sampleflow_dev@127.0.0.1:55432/postgres

      - name: 执行隔离 Compose 首装、升级与恢复门禁
        run: npm run test:container-runtime

      - name: 执行依赖与 Compose 配置门禁
        run: npm audit --omit=dev && docker compose --env-file .env.example config --quiet

      - name: 保存 Playwright 失败报告
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
