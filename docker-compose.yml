x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-runtime: &api-runtime
  cpus: 1.0
  mem_limit: 512m
  logging: *default-logging

services:
  db:
    image: postgres:16
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 1g
    logging: *default-logging
    networks: [backend]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sampleflow}
      POSTGRES_USER: ${POSTGRES_USER:-sampleflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
    volumes:
      - sampleflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    <<: *api-runtime
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    networks: [backend, proxy]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: 3000
      APP_ORIGINS: ${APP_ORIGINS:?请设置允许访问系统的完整 Origin}
      TRUST_PROXY_CIDR: ${SAMPLEFLOW_PROXY_SUBNET:?请设置仅承载 Web 反向代理的专用网段}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sampleflow}
      DB_USER: ${DB_APP_USER:?请设置 DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  db-migrate:
    <<: *api-runtime
    profiles: ["operations"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    networks: [backend]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sampleflow}
      DB_USER: ${DB_MIGRATION_USER:?请设置 DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?请设置 DB_MIGRATION_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "apps/api/dist/cli/migrate.js"]

  db-provision-roles:
    <<: *api-runtime
    profiles: ["operations"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    networks: [backend]
    environment:
      NODE_ENV: production
      DB_ADMIN_HOST: db
      DB_ADMIN_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sampleflow}
      DB_ADMIN_USER: ${POSTGRES_USER:-sampleflow}
      DB_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:?请设置 DB_MIGRATION_USER}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?请设置 DB_MIGRATION_PASSWORD}
      DB_APP_USER: ${DB_APP_USER:?请设置 DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
      DB_BACKUP_USER: ${DB_BACKUP_USER:?请设置 DB_BACKUP_USER}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?请设置 DB_BACKUP_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "apps/api/dist/cli/provision-database-roles.js"]

  admin-bootstrap:
    <<: *api-runtime
    profiles: ["operations"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    networks: [backend]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sampleflow}
      DB_USER: ${DB_APP_USER:?请设置 DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-sampleflow-admin}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "apps/api/dist/cli/bootstrap-admin.js"]

  import-preflight:
    <<: *api-runtime
    profiles: ["operations"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    networks: [backend]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sampleflow}
      DB_USER: ${DB_APP_USER:?请设置 DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
      IMPORT_SOURCE_FILE: /imports/source.xlsx
      IMPORT_CONFIG_ID: ${IMPORT_CONFIG_ID:-}
      IMPORT_OPERATOR_USER_ID: ${IMPORT_OPERATOR_USER_ID:-}
    volumes:
      - ${IMPORT_SOURCE_PATH:-./.sampleflow/import-source.xlsx}:/imports/source.xlsx:ro
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "apps/api/dist/cli/import-legacy.js"]

  import-confirm:
    <<: *api-runtime
    profiles: ["operations"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: "no"
    networks: [backend]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-sampleflow}
      DB_USER: ${DB_APP_USER:?请设置 DB_APP_USER}
      DB_PASSWORD: ${DB_APP_PASSWORD:?请设置 DB_APP_PASSWORD}
      IMPORT_BATCH_ID: ${IMPORT_BATCH_ID:-}
      IMPORT_OPERATOR_USER_ID: ${IMPORT_OPERATOR_USER_ID:-}
      IMPORT_CONFIRMED_WARNINGS: ${IMPORT_CONFIRMED_WARNINGS:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "apps/api/dist/cli/confirm-import.js"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 128m
    logging: *default-logging
    networks: [proxy]
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -qx ok"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  backend:
    internal: true
  proxy:
    ipam:
      config:
        - subnet: ${SAMPLEFLOW_PROXY_SUBNET:?请设置仅承载 Web 反向代理的专用网段}

volumes:
  sampleflow_pgdata:
